name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/knitmax-premium-redesign-k2tf4q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on for the repo the first time this runs,
      # so the site needs no manual setup in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is already static — the repo root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
