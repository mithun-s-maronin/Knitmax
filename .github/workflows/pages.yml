name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/knitmax-premium-redesign-k2tf4q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages itself has to be switched on once by a repo admin
      # (Settings -> Pages -> Source: "GitHub Actions"). The Actions token is
      # refused for site creation, so enablement: true cannot bootstrap it.
      - uses: actions/configure-pages@v5

      # The site is already static — the repo root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
